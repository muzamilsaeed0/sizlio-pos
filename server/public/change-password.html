<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Initial Password · Sizlio POS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1220;color:#f8fafc;font-family:Arial,Helvetica,sans-serif}.card{width:min(440px,100%);padding:28px;border:1px solid #334155;border-radius:18px;background:#111827;box-shadow:0 24px 70px #0006}h1{font-size:23px;margin:0 0 8px}p{color:#cbd5e1;line-height:1.5}.field{margin:18px 0}.field label{display:block;font-size:13px;margin-bottom:7px;color:#cbd5e1}.field input{width:100%;padding:13px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;font-size:16px}.btn{width:100%;border:0;border-radius:9px;padding:14px;background:#e8ac3e;color:#111827;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.6}.message{margin-top:14px;color:#fca5a5;font-size:14px}.hint{font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<main class="card">
  <h1>Change your initial password</h1>
  <p>Your Sizlio account is ready. For security, choose a new password before using the POS.</p>
  <form id="passwordForm">
    <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="4" maxlength="8" required></div>
    <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="4" maxlength="8" required></div>
    <p class="hint">Use 4 to 8 characters. Your new password will be stored securely as a hash.</p>
    <button class="btn" id="submitButton" type="submit">Change password</button>
    <div class="message" id="message" role="alert"></div>
  </form>
</main>
<script>
(function(){
  const token = sessionStorage.getItem('sizlio_first_login_token');
  const rawUser = sessionStorage.getItem('sizlio_first_login_user');
  const message = document.getElementById('message');
  if (!token || !rawUser) {
    message.textContent = 'Your login session is missing. Please return to the login page and sign in again.';
    document.getElementById('submitButton').disabled = true;
    return;
  }
  let user;
  try { user = JSON.parse(rawUser); } catch (_) { user = null; }
  if (!user || !user.role) {
    message.textContent = 'Login details could not be verified. Please sign in again.';
    document.getElementById('submitButton').disabled = true;
    return;
  }
  document.getElementById('passwordForm').addEventListener('submit', async function(event){
    event.preventDefault();
    message.textContent = '';
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword.length < 4 || newPassword.length > 8) { message.textContent = 'Password must be 4 to 8 characters.'; return; }
    if (newPassword !== confirmPassword) { message.textContent = 'Passwords do not match.'; return; }
    const button = document.getElementById('submitButton');
    button.disabled = true;
    button.textContent = 'Updating...';
    try {
      const response = await fetch('/api/auth/first-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        credentials: 'same-origin',
        body: JSON.stringify({ new_password: newPassword, confirm_password: confirmPassword })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || 'Password change failed.');
      sessionStorage.removeItem('sizlio_first_login_token');
      sessionStorage.removeItem('sizlio_first_login_user');
      message.style.color = '#86efac';
      message.textContent = 'Password changed. Redirecting to login...';
      const pages = { manager:'manager.html', waiter:'waiter.html', kitchen:'kitchen.html', counter:(user.business_type === 'wholesale' ? 'wholesale.html' : (user.plan === 'Cafe Lite' ? 'counter-lite.html' : 'counter.html')), delivery:'rider.html', rider:'rider.html', delivery_rider:'rider.html', display:'status.html' };
      const page = pages[user.role] || 'index.html';
      const url = new URL('/' + page, location.origin);
      if (user.restaurant_id) url.searchParams.set('restaurant', user.restaurant_id);
      setTimeout(() => { location.href = url.toString(); }, 900);
    } catch (error) {
      message.style.color = '#fca5a5';
      message.textContent = error.message || 'Unable to change password.';
      button.disabled = false;
      button.textContent = 'Change password';
    }
  });
})();
</script>
</body>
</html>
