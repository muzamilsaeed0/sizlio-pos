<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Board</title>
<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#14181C;
    --panel:#1F262C;
    --text:#F6F3EC;
    --border:#2A3138;
    --accent:#E3A23B;
    --danger:#E15A4C;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;
}

/* =====================================================
   LOGIN
===================================================== */
#login-box{
    max-width:340px;
    margin:80px auto;
    background:var(--panel);
    padding:32px 28px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    text-align:center;
}
#login-box h2{
    margin:0 0 24px;
    font-size:20px;
}
#login-box input,
.pw-wrap{
    width:100%;
    display:block;
}
#login-box input{
    padding:12px 14px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    font-size:14px;
}
#login-box input:focus{
    outline:none;
    border-color:var(--accent);
}
#login-box button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#14181C;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
}
#login-box button:disabled{
    opacity:.6;
    cursor:not-allowed;
}
#login-error{
    min-height:18px;
    font-size:13px;
    color:var(--danger);
    margin-bottom:0;
}
.pw-wrap{
    position:relative;
    margin:8px 0;
}
.pw-wrap input{
    margin:0!important;
    width:100%;
    padding-right:40px!important;
}
.pw-eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:15px;
    user-select:none;
}

/* =====================================================
   MAIN
===================================================== */
#app-box{
    width:100vw;
    height:100vh;
    padding: clamp(15px,3vw,50px);
    display:flex;
    flex-direction:column;
}
#app-box h2{
    margin:0 0 3vh;
    font-size: clamp(22px,3vw,55px);
}

/* =====================================================
   BRAND HEADER (display board)
===================================================== */
.brand-header{
    display:none;
    align-items:center;
    gap:14px;
}
.brand-header img{
    width:52px;
    height:52px;
    border-radius:12px;
    object-fit:cover;
    background:#fff;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.brand-header .brand-name{
    font-weight:800;
    font-size:clamp(16px,2vw,22px);
    letter-spacing:-0.02em;
    color:var(--text);
}

/* =====================================================
   TOP BAR (Fixed Layout)
===================================================== */
.top-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    min-height: 60px;
}

/* LEFT: Logo + Restaurant Name */
.top-bar-left {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    min-width: 0;
    justify-self: start;
}

/* CENTER: Live Order Status */
#app-box .top-bar h2 {
    margin: 0;
    font-size: clamp(20px, 2.8vw, 42px);
    font-weight: 800;
    letter-spacing: -0.03em;
    white-space: nowrap;
    text-align: center;
    justify-self: center;
}

/* RIGHT: Restaurant ID + Logout */
.top-bar-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    justify-self: end;
}

/* =====================================================
   RESTAURANT ID
===================================================== */
.restaurant-id-label{
    color:#9CA3AF;
    font-size:12px;
    margin-left:auto;
    white-space:nowrap;
}

/* =====================================================
   ORDER GRID
===================================================== */
#orders-list{
    flex:1;
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
    gap: clamp(12px,2vw,30px);
    overflow:auto;
    padding-bottom:20px;
}

/* =====================================================
   CARD
===================================================== */
.row{ 
    background:#1F262C; 
    display:flex;
    flex-direction:column; 
    justify-content:center; 
    gap:clamp(6px,1.2vw,16px); 
    padding: clamp(15px,2vw,45px); 
    min-height: clamp(90px,15vh,200px); 
    border-radius: clamp(12px,1.5vw,25px); 
    border-left: clamp(6px,0.8vw,14px) solid transparent; 
    overflow:hidden;
}

/* =====================================================
   TABLE & CUSTOMER NAME
===================================================== */
.row .left{ 
    display:flex; 
    flex-direction: column; 
    align-items: flex-start; 
    gap: 4px; 
    min-width:0; 
    width:100%; 
} 

.row .left b{ 
    font-size: clamp(20px,3.5vw,56px); 
    white-space:nowrap; 
    overflow:hidden; 
    text-overflow:ellipsis; 
    max-width:100%; 
}

.customer-name {
    font-size: clamp(14px, 1.8vw, 28px);
    color: #9CA3AF;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
}

/* =====================================================
   ORDER NUMBER
===================================================== */
.meta{
    color:#9CA3AF;
    font-size: clamp(14px,1.5vw,32px);
    white-space:nowrap;
}

/* =====================================================
   STATUS
===================================================== */
.status-label{ 
    font-weight:900; 
    font-size: clamp(16px,2.5vw,44px); 
    text-align:left; 
    white-space:normal; 
    word-break:break-word; 
}

/* =====================================================
   COUNTDOWN
===================================================== */
.countdown{
    color:#E3A23B;
    font-weight:900;
    font-size: clamp(16px,2vw,40px);
    display:block;
    margin-top:4px;
    white-space:nowrap;
}

/* =====================================================
   COLORS
===================================================== */
.status-pending, .status-placed, .status-accepted, .status-confirmed, .status-preparing {
    color:#E3A23B;
}
.row.pending, .row.placed, .row.accepted, .row.confirmed, .row.preparing {
    border-left-color:#E3A23B;
}

.status-ready, .status-ready_to_deliver, .status-ready_to_dispatch {
    color:#2FA37D;
}
.row.ready, .row.ready_to_deliver, .row.ready_to_dispatch {
    border-left-color:#2FA37D;
}

.status-out_for_delivery {
    color:#E3A23B;
}
.row.out_for_delivery {
    border-left-color:#E3A23B;
}

.status-served {
    color: #2FA37D;          
}
.row.served {
    border-left-color: #2FA37D;
    opacity: 0.75;          
}

.row .right{ 
    display:flex; 
    align-items:center; 
    justify-content:flex-start;
    min-width:0; 
    width:100%; 
}

.empty, .loading, .screen-error{
    text-align:center;
    padding:40px;
    grid-column:1 / -1;
    font-size:18px;
}
.empty{ color:#6B7280; }
.loading{ color:#9CA3AF; }
.screen-error{ color:#E15A4C; }

/* =====================================================
   LARGE SCREEN
===================================================== */
@media(min-width:1600px){
    #orders-list{
        grid-template-columns: repeat(2,1fr);
    }
    .row{
        min-height:180px;
    }
}

/* =====================================================
   MOBILE
===================================================== */
@media(max-width:600px){
    html, body{
        overflow-x:hidden;
        overflow-y:auto;
    }
    #app-box{
        height:auto;
        min-height:100vh;
        padding:15px;
    }
   
    .top-bar{
        grid-template-columns:1fr auto;
        row-gap:10px;
    }
    #app-box .top-bar h2{
        grid-column:1 / -1;
        grid-row:2;
        font-size:20px;
    }
    .brand-header img{
        width:40px;
        height:40px;
    }
    #orders-list{
        grid-template-columns:1fr;
    }
    .row{
        min-height:80px;
        padding:15px;
    }
    .row .left b{
        font-size:24px;
    }
    .status-label{
        font-size:18px;
    }
    .restaurant-id-label{
        font-size:10px;
    }
}

.row .left b.walk-in-label {
    color: #E3A23B;
    font-size: clamp(18px, 2.5vw, 40px);
}
</style>
</head>
<body>

<!-- LOGIN BOX -->
<div id="login-box">
    <h2>Status Board Login</h2>
    <input id="username" placeholder="Username" autocomplete="username" />
    <div class="pw-wrap">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <span class="pw-eye" onmousedown="showPassword()" onmouseup="hidePassword()" onmouseleave="hidePassword()" ontouchstart="showPassword()" ontouchend="hidePassword()">👁</span>
    </div>
    <button id="login-btn" onclick="login()">Login</button>
    <p id="login-error"></p>
</div>

<div id="app-box" style="display:none;">
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="brand-header" id="brand-header"></div>
        </div>
        <h2>Live Order Status</h2>
        <div class="top-bar-right">
            <span id="restaurant-id-label" class="restaurant-id-label"></span>
            <button onclick="logout()" style="background:#E15A4C;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer;">
                Logout
            </button>
        </div>
    </div>
    <div id="orders-list">
        <div class="loading">Loading orders...</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>

let token = localStorage.getItem('status_token');
let socket = null;
let loadingOrders = false;

const urlParams = new URLSearchParams(window.location.search);
const restaurantId = urlParams.get('restaurant');

function isValidRestaurantId(){
    if(restaurantId === null || restaurantId === undefined || String(restaurantId).trim() === ''){
        return false;
    }
    return /^\d+$/.test(String(restaurantId).trim());
}

function showRestaurantIdError(){
    const loginBox = document.getElementById('login-box');
    const error = document.getElementById('login-error');
    if(loginBox){ loginBox.style.display = 'block'; }
    if(error){ error.innerText = 'Restaurant ID is missing or invalid. Open this screen with ?restaurant=ID'; }
}

function showPassword(){
    const input = document.getElementById('password');
    if(input){ input.type = 'text'; }
}

function hidePassword(){
    const input = document.getElementById('password');
    if(input){ input.type = 'password'; }
}

async function getJsonResponse(res){
    try{ return await res.json(); }catch(error){ return {}; }
}

function handleAuthFailure(){
    localStorage.removeItem('status_token');
    localStorage.removeItem('display_restaurant_id');
    token = null;
    if(socket){
        try{ socket.removeAllListeners(); socket.disconnect(); }catch(error){ console.warn('Socket cleanup:', error); }
    }
    socket = null;
    const app = document.getElementById('app-box');
    const loginBox = document.getElementById('login-box');
    if(app){ app.style.display = 'none'; }
    if(loginBox){ loginBox.style.display = 'block'; }
    const error = document.getElementById('login-error');
    if(error){ error.innerText = 'Session expired. Please login again.'; }
}

function createSocket(){
    if(!token){ return; }
    if(socket){
        try{ socket.removeAllListeners(); socket.disconnect(); }catch(error){ console.warn('Old socket cleanup:', error); }
    }
    socket = io({
        autoConnect:false,
        reconnection:true,
        reconnectionAttempts:Infinity,
        reconnectionDelay:1000,
        transports:['websocket','polling'],
        auth:{ token:token, restaurant_id: restaurantId }
    });
    socket.on('connect', () => { console.log('STATUS CONNECTED', socket.id, 'RESTAURANT:', restaurantId); });
    socket.on('disconnect', (reason) => { console.log('STATUS DISCONNECTED', reason); });
    socket.on('connect_error', (err) => { console.log('STATUS SOCKET ERROR', err?.message || err); });
    socket.on('order_created', () => { if(!token) return; loadOrders(); });
    socket.on('customer_order_created', () => { if(!token) return; loadOrders(); });
    socket.on('order_updated', () => { if(!token) return; loadOrders(); });
    socket.on('orders_refresh', () => { if(!token) return; loadOrders(); });
}

const STATUS_LABEL = {
    pending: 'Order Sent',
    placed: 'Order Sent',
    accepted: 'Accepted',
    confirmed: 'Preparing',
    preparing: 'Preparing',
    ready: 'Ready To Serve',
    ready_to_dispatch: 'Ready for Customer',
    ready_to_deliver: 'Ready To Deliver',
    out_for_delivery: 'Out For Delivery',
    served: 'Served' 
};

async function login(){
    if(!isValidRestaurantId()){
        showRestaurantIdError();
        return;
    }

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');

    const username = usernameInput?.value.trim() || '';
    const password = passwordInput?.value || '';

    if(!username || !password){
        if(loginError){ loginError.innerText = 'Username and password are required.'; }
        return;
    }

    if(loginBtn){ loginBtn.disabled = true; loginBtn.innerText = 'Logging in...'; }
    if(loginError){ loginError.innerText = ''; }

    try{
        const res = await fetch('/api/auth/login', {
            method:'POST',
            headers:{ 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, restaurant_id: restaurantId, role: 'display' })
        });

        const data = await getJsonResponse(res);

        if(!res.ok || !data.token){
            throw new Error(data.message || 'Login failed.');
        }

        if(!data.user || data.user.role !== 'display'){
            throw new Error('This login is for the Status Board account only.');
        }

        if (data.user.must_change_password) {
          sessionStorage.setItem('sizlio_first_login_token', data.token);
          sessionStorage.setItem('sizlio_first_login_user', JSON.stringify(data.user));
          location.href = '/change-password.html';
          return;
        }

        if(String(data.user.restaurant_id) !== String(restaurantId)){
            throw new Error('This display account does not belong to this restaurant.');
        }

        token = data.token;
        localStorage.setItem('status_token', token);
        localStorage.setItem('display_restaurant_id', String(restaurantId));

        createSocket();
        if(socket && !socket.connected){ socket.connect(); }

        document.getElementById('login-box').style.display = 'none';
        document.getElementById('app-box').style.display = 'flex';

        loadBranding();
        loadOrders();

    }catch(error){
        console.error('STATUS LOGIN ERROR:', error);
        if(loginError){ loginError.innerText = error.message || 'Unable to login.'; }
    }finally{
        if(loginBtn){ loginBtn.disabled = false; loginBtn.innerText = 'Login'; }
    }
}

async function loadOrders(){
    if(!token || !isValidRestaurantId() || loadingOrders){ return; }
    loadingOrders = true;
    const list = document.getElementById('orders-list');
    if(list){ list.innerHTML = `<div class="loading">Loading orders...</div>`; }

    try{
        const res = await fetch('/api/orders', {
            headers:{ 'Authorization': 'Bearer ' + token }
        });

        if(res.status === 401){
            handleAuthFailure();
            return;
        }

        const result = await getJsonResponse(res);

        if(!res.ok){
            throw new Error(result.message || 'Orders load failed. HTTP ' + res.status);
        }

        let orders = [];
        if(Array.isArray(result)){ orders = result; }
        else if(result && Array.isArray(result.orders)){ orders = result.orders; }
        else if(result && Array.isArray(result.data)){ orders = result.data; }

        const restaurantOrders = orders.filter(o => {
            if(!o){ return false; }
            const orderRestaurantId = o.restaurant_id ?? o.restaurantId ?? o.restaurant;
            return String(orderRestaurantId) === String(restaurantId);
        });

        const activeOrders = restaurantOrders.filter(o => {
            if(!o){ return false; }
            const status = String(o.status || '').toLowerCase();
            if (status === 'completed' || status === 'cancelled') { return false; }
            return ['pending', 'placed', 'accepted', 'confirmed', 'preparing', 'ready', 'ready_to_dispatch', 'ready_to_deliver', 'out_for_delivery', 'served'].includes(status);
        });

        renderOrders(activeOrders);

    }catch(error){
        console.error('STATUS LOAD ORDERS ERROR:', error);
        if(list){
            list.innerHTML = `
                <div class="screen-error">
                    Unable to load orders. <br><br>
                    ${escapeHtml(error.message || 'Unknown error')} <br><br>
                    <button onclick="loadOrders()" style="padding:10px 18px; border:0; border-radius:7px; cursor:pointer; font-weight:bold;">
                        Retry
                    </button>
                </div>
            `;
        }
    }finally{
        loadingOrders = false;
    }
}

function escapeHtml(value){
    if(value === null || value === undefined){ return ''; }
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function renderOrders(orders){
    const list = document.getElementById('orders-list');
    if(!list){ return; }
    if(!Array.isArray(orders)){ orders = []; }

    if(!orders.length){
        list.innerHTML = `<div class="empty">No orders right now.</div>`;
        return;
    }

    list.innerHTML = orders.map(o => {
        const status = String(o.status || '').toLowerCase();
        const orderType = String(o.order_type || '').toLowerCase();
        const rawTableNo = o.table_no ?? o.table_number ?? null;

        let locationLabel = '';
        const customerName = o.customer_name ?? o.customerName ?? o.name ?? o.customer?.name ?? '';

        // Base Label
        if (orderType === 'delivery') {
            locationLabel = 'Delivery';
        } else if (orderType === 'walk_in' || orderType === 'walkin' || orderType === 'walk in') {
            locationLabel = 'Walk-in';
        } else if (orderType === 'takeaway' || orderType === 'take away') {
            locationLabel = 'Takeaway';
        } else if (rawTableNo !== null && rawTableNo !== undefined && String(rawTableNo).trim() !== '' && Number(rawTableNo) !== 0) {
            locationLabel = `Table ${escapeHtml(rawTableNo)}`;
        } else {
            locationLabel = 'Order';
        }

        // HTML for Customer Name (Show for Delivery, Walk-in, Takeaway)
        let nameHtml = '';
        if (
            customerName && 
            String(customerName).trim() !== '' && 
            (orderType === 'delivery' || orderType === 'walk_in' || orderType === 'walkin' || orderType === 'walk in' || orderType === 'takeaway' || orderType === 'take away')
        ) {
            nameHtml = `<span class="customer-name">${escapeHtml(String(customerName).trim())}</span>`;
        }

        let prepText = '';
        if(status === 'preparing' && o.confirmed_at && Number(o.prep_minutes) > 0){
            prepText = `
                <span class="meta countdown" data-time="${escapeHtml(o.confirmed_at)}" data-minutes="${Number(o.prep_minutes)}">
                    Calculating...
                </span>
            `;
        }

        return `
            <div class="row ${escapeHtml(status)}" data-restaurant-id="${escapeHtml(restaurantId)}">
                <div class="left">
                    <b>${locationLabel}</b>
                    ${nameHtml}
                    ${prepText}
                </div>
                <div class="right">
                    <span class="status-label status-${escapeHtml(status)}">
                        ${escapeHtml(STATUS_LABEL[status] || status || 'Unknown')}
                    </span>
                </div>
            </div>
        `;
    }).join('');

    updateCountdown();
}

async function loadBranding(){
    try{
        const res = await fetch('/api/restaurants/me', {
            headers:{ 'Authorization': 'Bearer ' + token }
        });
        if(!res.ok) return;
        const data = await res.json();
        const restaurant = data.data || data.restaurant || data || {};
        if(restaurant.id !== undefined && String(restaurant.id) !== String(restaurantId)){ return; }

        const header = document.getElementById('brand-header');
        if(!header) return;

        const name = restaurant.name || 'Restaurant';
        const logoUrl = restaurant.logo_url || restaurant.logo || '';

        header.style.display = 'flex';
        header.innerHTML =
            (logoUrl
                ? `<img src="${escapeHtml(logoUrl)}" alt="" onerror="this.style.display='none'">`
                : '') +
            `<span class="brand-name">${escapeHtml(name)}</span>`;
    }catch(error){
        console.error('BRANDING LOAD ERROR:', error);
    }
}

function logout(){
    localStorage.removeItem('status_token');
    localStorage.removeItem('display_restaurant_id');

    token = null;

    if(socket){
        try{ socket.removeAllListeners(); socket.disconnect(); }catch(error){ console.warn('Socket logout error:', error); }
    }
    socket = null;

    const app = document.getElementById('app-box');
    const loginBox = document.getElementById('login-box');
    const list = document.getElementById('orders-list');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const error = document.getElementById('login-error');

    if(app){ app.style.display = 'none'; }
    if(loginBox){ loginBox.style.display = 'block'; }
    if(list){ list.innerHTML = ''; }
    if(username){ username.value = ''; }
    if(password){ password.value = ''; }
    if(error){ error.innerText = ''; }
}

function updateCountdown(){
    document.querySelectorAll('.countdown').forEach(el => {
        const start = new Date(el.dataset.time).getTime();
        const minutes = Number(el.dataset.minutes);

        if(!Number.isFinite(start) || !Number.isFinite(minutes) || minutes <= 0){
            el.innerHTML = '· Ready'; return;
        }

        const end = start + (minutes * 60 * 1000);
        let diff = Math.floor((end - Date.now()) / 1000);

        if(diff <= 0){ el.innerHTML = '· Ready'; return; }

        const m = Math.floor(diff / 60);
        const s = diff % 60;
        el.innerHTML = `· ${m}:${s.toString().padStart(2, '0')} min`;
    });
}

setInterval(updateCountdown, 1000);

window.addEventListener('load', () => {
    if(!isValidRestaurantId()){
        showRestaurantIdError();
        return;
    }

    const saved = localStorage.getItem('status_token');
    if(!saved){ return; }

    token = saved;
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('app-box').style.display = 'flex';

    createSocket();
    if(socket && !socket.connected){ socket.connect(); }

    loadBranding();
    loadOrders();
});

</script>
</body>
</html>
