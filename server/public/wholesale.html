<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Wholesale · Sizlio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0B0E14; --panel: #141A23; --panel2: #1B222D;
      --text: #F5F7FA; --muted: #8893A3; --border: rgba(255,255,255,.08);
      --accent: #E8AC3E; --ok: #29C29A; --danger: #EF5B50;
      --radius: 12px;
    }
    body {
      margin: 0; font-family: Inter, system-ui, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    h1,h2,h3 { font-family: Poppins, Inter, sans-serif; margin: 0; }
    button, input, select { font: inherit; }
    .hidden { display: none !important; }
    .btn {
      border: 1px solid var(--border); background: var(--panel2); color: var(--text);
      border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .btn:hover { border-color: rgba(255,255,255,.18); }
    .btn-accent { background: var(--accent); color: #1B1404; border-color: transparent; }
    .btn-ok { background: rgba(41,194,154,.15); color: var(--ok); border-color: rgba(41,194,154,.35); }
    .btn-danger { background: rgba(239,91,80,.12); color: var(--danger); border-color: rgba(239,91,80,.3); }
    .btn-ghost { background: transparent; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 8px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 4px; }

    #login-box {
      max-width: 380px; margin: 12vh auto; padding: 28px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    }
    #login-box h1 { font-size: 22px; margin-bottom: 6px; }
    #login-box p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    #login-error { color: var(--danger); font-size: 13px; min-height: 18px; }

    .top {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .brand { font-weight: 800; font-size: 16px; }
    .pill {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: rgba(232,172,62,.15); color: var(--accent);
    }
    .spacer { flex: 1; }
    .muted { color: var(--muted); font-size: 13px; }

    .tabs {
      display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .tab.active { background: var(--accent); color: #1B1404; border-color: transparent; }

    .page { display: none; padding: 16px; }
    .page.active { display: block; }

    .sale-grid {
      display: grid; grid-template-columns: 1.4fr 0.9fr; gap: 14px;
    }
    @media (max-width: 900px) {
      .sale-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
    }
    .panel h3 { font-size: 15px; margin-bottom: 10px; }
    .search { margin-bottom: 10px; }

    .prod-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
      max-height: 62vh; overflow: auto;
    }
    .prod-card {
      background: var(--panel2); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; cursor: pointer; transition: border-color .15s;
    }
    .prod-card:hover { border-color: rgba(232,172,62,.45); }
    .prod-card.low { border-color: rgba(239,91,80,.45); }
    .prod-card .name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .prod-card .meta { font-size: 11px; color: var(--muted); }
    .prod-card .price { margin-top: 8px; font-weight: 800; color: var(--accent); font-size: 14px; }

    .cart-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      border-bottom: 1px solid var(--border); font-size: 13px;
    }
    .cart-row .nm { flex: 1; min-width: 0; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); cursor: pointer; font-weight: 700;
    }
    .totals { margin-top: 12px; font-size: 14px; }
    .totals .row { display: flex; justify-content: space-between; margin: 4px 0; }
    .totals .grand { font-size: 18px; font-weight: 800; margin-top: 8px; color: var(--accent); }

    .split { display: grid; grid-template-columns: 1.3fr 0.9fr; gap: 14px; }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .empty { color: var(--muted); padding: 20px 0; text-align: center; font-size: 13px; }

    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    }
    .stat .lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .stat .val { font-size: 18px; font-weight: 800; }
  </style>
</head>
<body>

  <div id="login-box">
    <h1>Wholesale</h1>
    <p>Sizlio · products, cash sale, stock, reports</p>
    <label>Username</label>
    <input id="username" autocomplete="username" />
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div id="login-error"></div>
    <button class="btn btn-accent" style="width:100%;margin-top:12px;" onclick="login()">Login</button>
  </div>

  <div id="app" class="hidden">
    <div class="top">
      <span class="brand" id="brandName">Wholesale</span>
      <span class="pill">Wholesale</span>
      <span class="muted" id="todaySales">Today: —</span>
      <span class="spacer"></span>
      <span class="muted" id="userLabel"></span>
      <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="sale" onclick="showTab('sale')">Sale</button>
      <button class="tab" data-tab="products" onclick="showTab('products')">Products</button>
      <button class="tab" data-tab="invoices" onclick="showTab('invoices')">Invoices</button>
      <button class="tab" data-tab="report" onclick="showTab('report')">Today</button>
    </div>

    <!-- SALE -->
    <div id="page-sale" class="page active">
      <div class="sale-grid">
        <div class="panel">
          <input class="search" id="saleSearch" placeholder="Search name / SKU / barcode…" oninput="renderSaleGrid()" />
          <div class="prod-grid" id="saleGrid"></div>
        </div>
        <div class="panel">
          <h3>Cart</h3>
          <label>Customer name (optional)</label>
          <input id="custName" placeholder="Walk-in" />
          <div id="cartList"><div class="empty">Tap products to add</div></div>
          <div class="totals">
            <div class="row"><span class="muted">Subtotal</span><span id="cartSub">Rs 0</span></div>
            <label>Discount Rs</label>
            <input id="saleDiscount" type="number" min="0" step="1" value="0" oninput="renderCart()" />
            <div class="row grand"><span>Total</span><span id="cartTotal">Rs 0</span></div>
          </div>
          <button class="btn btn-accent" style="width:100%;margin-top:10px;" onclick="placeSale()">Cash sale</button>
        </div>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div id="page-products" class="page">
      <div class="split">
        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <h3>All products</h3>
            <button class="btn btn-sm" onclick="loadProducts()">Refresh</button>
          </div>
          <div style="overflow:auto;">
            <table>
              <thead>
                <tr>
                  <th>Name</th><th>SKU</th><th>Stock</th><th>Sale</th><th></th>
                </tr>
              </thead>
              <tbody id="productTable"></tbody>
            </table>
          </div>
        </div>
        <div class="panel">
          <h3 id="prodFormTitle">Add product</h3>
          <input type="hidden" id="editProdId" value="" />
          <label>Name *</label>
          <input id="pName" />
          <label>SKU / Barcode</label>
          <input id="pSku" placeholder="optional" />
          <label>Unit</label>
          <select id="pUnit">
            <option value="pcs">pcs</option>
            <option value="carton">carton</option>
            <option value="box">box</option>
            <option value="bag">bag</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="ltr">ltr</option>
            <option value="ml">ml</option>
            <option value="set">set</option>
          </select>
          <label>Purchase price</label>
          <input id="pPurchase" type="number" min="0" step="0.01" value="0" />
          <label>Sale price *</label>
          <input id="pSale" type="number" min="0" step="0.01" />
          <label>Stock</label>
          <input id="pStock" type="number" min="0" step="0.001" value="0" />
          <label>Min stock</label>
          <input id="pMin" type="number" min="0" step="0.001" value="0" />
          <label>Category</label>
          <input id="pCat" placeholder="e.g. Crockery, Grocery" />
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn btn-ghost" onclick="resetProdForm()">Clear</button>
            <button class="btn btn-accent" style="flex:1;" onclick="saveProduct()">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- INVOICES -->
    <div id="page-invoices" class="page">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h3>Recent invoices</h3>
          <button class="btn btn-sm" onclick="loadInvoices()">Refresh</button>
        </div>
        <div style="overflow:auto;">
          <table>
            <thead>
              <tr><th>#</th><th>Customer</th><th>Total</th><th>Paid</th><th>Time</th><th></th></tr>
            </thead>
            <tbody id="invoiceTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TODAY REPORT -->
    <div id="page-report" class="page">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3>Today summary</h3>
          <button class="btn btn-sm" onclick="loadReport()">Refresh</button>
        </div>
        <div class="stat-grid" id="reportStats">
          <div class="stat"><div class="lbl">Invoices</div><div class="val" id="stCount">—</div></div>
          <div class="stat"><div class="lbl">Sales</div><div class="val" id="stSales">—</div></div>
          <div class="stat"><div class="lbl">Paid</div><div class="val" id="stPaid">—</div></div>
          <div class="stat"><div class="lbl">Discount</div><div class="val" id="stDisc">—</div></div>
        </div>
        <h3 style="margin-bottom:8px;">Low stock</h3>
        <div id="lowStockBox" class="muted">—</div>
      </div>
    </div>
  </div>

<script>
  const API = '/api';
  const params = new URLSearchParams(location.search);
  let restaurantId = Number(params.get('restaurant')) || Number(localStorage.getItem('ws_restaurant_id')) || null;
  let token = localStorage.getItem('ws_token') || '';
  let products = [];
  let cart = [];

  function money(n) {
    return 'Rs ' + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function api(path, opts = {}) {
    const headers = Object.assign(
      { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      opts.headers || {}
    );
    const res = await fetch(API + path, Object.assign({}, opts, { headers }));
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) {
      const msg = data.message || ('Request failed (' + res.status + ')');
      if (res.status === 401) { logout(); }
      throw new Error(msg);
    }
    return data;
  }

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const rid = Number(new URLSearchParams(location.search).get('restaurant')) || restaurantId;
    const err = document.getElementById('login-error');
    err.textContent = '';
    if (!rid) {
      err.textContent = 'Open link with restaurant id, e.g. wholesale.html?restaurant=57';
      return;
    }
    if (!username || !password) {
      err.textContent = 'Username and password required';
      return;
    }
    try {
      const body = { username, password, role: 'counter', restaurant_id: rid };
      const res = await fetch(API + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!data.token) {
        err.textContent = data.message || 'Login failed';
        return;
      }
      if (data.user && data.user.business_type && data.user.business_type !== 'wholesale') {
        err.textContent = 'This login is not a wholesale shop. Use restaurant POS screens.';
        return;
      }
      if (!['counter', 'manager'].includes(data.user?.role)) {
        err.textContent = 'Only counter or manager can use wholesale screen.';
        return;
      }
      token = data.token;
      restaurantId = data.user.restaurant_id;
      localStorage.setItem('ws_token', token);
      localStorage.setItem('ws_restaurant_id', String(restaurantId));
      localStorage.setItem('ws_user', JSON.stringify(data.user));
      await boot();
    } catch (e) {
      err.textContent = e.message || 'Server connection failed';
    }
  }

  function logout() {
    token = '';
    localStorage.removeItem('ws_token');
    localStorage.removeItem('ws_user');
    location.reload();
  }

  async function boot() {
    document.getElementById('login-box').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    const user = JSON.parse(localStorage.getItem('ws_user') || '{}');
    document.getElementById('brandName').textContent = user.restaurant_name || 'Wholesale';
    document.getElementById('userLabel').textContent = (user.name || user.role || '') + '';
    await loadProducts();
    await loadInvoices();
    loadReport().catch(() => {});
  }

  function showTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const page = document.getElementById('page-' + name);
    if (page) page.classList.add('active');
    if (name === 'sale' || name === 'products') loadProducts();
    if (name === 'invoices') loadInvoices();
    if (name === 'report') loadReport();
  }

  async function loadProducts() {
    const data = await api('/wholesale/products');
    products = data.data || [];
    renderSaleGrid();
    renderProductTable();
  }

  function renderSaleGrid() {
    const q = (document.getElementById('saleSearch').value || '').toLowerCase().trim();
    const list = products.filter(p => {
      if (!q) return true;
      return [p.name, p.sku, p.barcode, p.category]
        .filter(Boolean)
        .some(v => String(v).toLowerCase().includes(q));
    });
    const grid = document.getElementById('saleGrid');
    if (!list.length) {
      grid.innerHTML = '<div class="empty">No products</div>';
      return;
    }
    grid.innerHTML = list.map(p => {
      const low = Number(p.min_stock) > 0 && Number(p.stock) <= Number(p.min_stock);
      return `
        <div class="prod-card ${low ? 'low' : ''}" onclick="addToCart(${p.id})">
          <div class="name">${esc(p.name)}</div>
          <div class="meta">${esc(p.unit || 'pcs')} · Stock ${Number(p.stock)}${p.sku ? ' · ' + esc(p.sku) : ''}</div>
          <div class="price">${money(p.sale_price)}</div>
        </div>`;
    }).join('');
  }

  function addToCart(productId) {
    const p = products.find(x => Number(x.id) === Number(productId));
    if (!p) return;
    const row = cart.find(c => Number(c.product_id) === Number(productId));
    if (row) {
      if (row.qty + 1 > Number(p.stock)) { alert('Not enough stock'); return; }
      row.qty += 1;
    } else {
      if (Number(p.stock) < 1) { alert('Out of stock'); return; }
      cart.push({
        product_id: Number(p.id),
        name: p.name,
        price: Number(p.sale_price),
        qty: 1,
        unit: p.unit || 'pcs',
        stock: Number(p.stock)
      });
    }
    renderCart();
  }

  function changeQty(productId, delta) {
    const row = cart.find(c => Number(c.product_id) === Number(productId));
    if (!row) return;
    row.qty += delta;
    if (row.qty <= 0) cart = cart.filter(c => Number(c.product_id) !== Number(productId));
    else if (row.qty > row.stock) { row.qty = row.stock; alert('Max stock ' + row.stock); }
    renderCart();
  }

  function renderCart() {
    const box = document.getElementById('cartList');
    if (!cart.length) {
      box.innerHTML = '<div class="empty">Tap products to add</div>';
      document.getElementById('cartSub').textContent = money(0);
      document.getElementById('cartTotal').textContent = money(0);
      return;
    }
    let sub = 0;
    box.innerHTML = cart.map(c => {
      const line = c.price * c.qty;
      sub += line;
      return `
        <div class="cart-row">
          <div class="nm"><b>${esc(c.name)}</b><div class="muted">${money(c.price)} / ${esc(c.unit)}</div></div>
          <button class="qty-btn" onclick="changeQty(${c.product_id},-1)">−</button>
          <span>${c.qty}</span>
          <button class="qty-btn" onclick="changeQty(${c.product_id},1)">+</button>
          <b>${money(line)}</b>
        </div>`;
    }).join('');
    const disc = Number(document.getElementById('saleDiscount').value || 0);
    const total = Math.max(0, sub - (Number.isFinite(disc) ? disc : 0));
    document.getElementById('cartSub').textContent = money(sub);
    document.getElementById('cartTotal').textContent = money(total);
  }

  async function placeSale() {
    if (!cart.length) { alert('Cart is empty'); return; }
    const discount = Number(document.getElementById('saleDiscount').value || 0);
    const body = {
      items: cart.map(c => ({ product_id: c.product_id, qty: c.qty })),
      discount: Number.isFinite(discount) ? discount : 0,
      customer_name: document.getElementById('custName').value.trim() || 'Walk-in'
    };
    try {
      const data = await api('/wholesale/sales', { method: 'POST', body: JSON.stringify(body) });
      const inv = data.invoice || {};
      cart = [];
      document.getElementById('saleDiscount').value = 0;
      document.getElementById('custName').value = '';
      renderCart();
      await loadProducts();
      await loadInvoices();
      if (confirm('Sale done. Invoice #' + (inv.local_number || inv.id) + ' · ' + money(inv.total) + '\n\nPrint invoice?')) {
        if (inv.id) printInvoice(inv.id);
      }
    } catch (e) {
      alert(e.message || 'Sale failed');
    }
  }

  function renderProductTable() {
    const tb = document.getElementById('productTable');
    if (!products.length) {
      tb.innerHTML = '<tr><td colspan="5" class="muted">No products</td></tr>';
      return;
    }
    tb.innerHTML = products.map(p => `
      <tr>
        <td><b>${esc(p.name)}</b><div class="muted">${esc(p.category || '')}</div></td>
        <td class="muted">${esc(p.sku || '—')}</td>
        <td>${Number(p.stock)} <span class="muted">${esc(p.unit || '')}</span></td>
        <td>${money(p.sale_price)}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-sm" onclick="editProduct(${p.id})">Edit</button>
          <button class="btn btn-sm btn-ok" onclick="adjustStock(${p.id})">Stock ±</button>
          <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">Del</button>
        </td>
      </tr>`).join('');
  }

  function resetProdForm() {
    document.getElementById('editProdId').value = '';
    document.getElementById('prodFormTitle').textContent = 'Add product';
    document.getElementById('pName').value = '';
    document.getElementById('pSku').value = '';
    document.getElementById('pUnit').value = 'pcs';
    document.getElementById('pPurchase').value = 0;
    document.getElementById('pSale').value = '';
    document.getElementById('pStock').value = 0;
    document.getElementById('pMin').value = 0;
    document.getElementById('pCat').value = '';
  }

  function editProduct(id) {
    const p = products.find(x => Number(x.id) === Number(id));
    if (!p) return;
    document.getElementById('editProdId').value = p.id;
    document.getElementById('prodFormTitle').textContent = 'Edit product';
    document.getElementById('pName').value = p.name || '';
    document.getElementById('pSku').value = p.sku || '';
    document.getElementById('pUnit').value = p.unit || 'pcs';
    document.getElementById('pPurchase').value = p.purchase_price || 0;
    document.getElementById('pSale').value = p.sale_price || 0;
    document.getElementById('pStock').value = p.stock || 0;
    document.getElementById('pMin').value = p.min_stock || 0;
    document.getElementById('pCat').value = p.category || '';
    showTab('products');
  }

  async function saveProduct() {
    const id = document.getElementById('editProdId').value;
    const body = {
      name: document.getElementById('pName').value.trim(),
      sku: document.getElementById('pSku').value.trim() || null,
      unit: document.getElementById('pUnit').value,
      purchase_price: Number(document.getElementById('pPurchase').value || 0),
      sale_price: Number(document.getElementById('pSale').value),
      stock: Number(document.getElementById('pStock').value || 0),
      min_stock: Number(document.getElementById('pMin').value || 0),
      category: document.getElementById('pCat').value.trim() || null
    };
    if (!body.name || !(body.sale_price >= 0)) {
      alert('Name and sale price required');
      return;
    }
    try {
      if (id) await api('/wholesale/products/' + id, { method: 'PUT', body: JSON.stringify(body) });
      else await api('/wholesale/products', { method: 'POST', body: JSON.stringify(body) });
      resetProdForm();
      await loadProducts();
      alert('Saved');
    } catch (e) {
      alert(e.message || 'Save failed');
    }
  }

  async function deleteProduct(id) {
    if (!confirm('Remove this product?')) return;
    try {
      await api('/wholesale/products/' + id, { method: 'DELETE' });
      await loadProducts();
    } catch (e) {
      alert(e.message || 'Delete failed');
    }
  }

  async function adjustStock(id) {
    const p = products.find(x => Number(x.id) === Number(id));
    const delta = Number(prompt(
      (p ? p.name + ' · current ' + Number(p.stock) + '\n' : '') +
      'Stock change (+ purchase / − damage):',
      '10'
    ));
    if (!Number.isFinite(delta) || delta === 0) return;
    const reason = prompt('Reason (optional):', '') || null;
    try {
      await api('/wholesale/products/' + id + '/stock', {
        method: 'POST',
        body: JSON.stringify({ delta, reason })
      });
      await loadProducts();
      alert('Stock updated');
    } catch (e) {
      alert(e.message || 'Stock adjust failed');
    }
  }

  async function loadInvoices() {
    try {
      const data = await api('/wholesale/invoices');
      const list = data.data || [];
      const tb = document.getElementById('invoiceTable');
      if (!list.length) {
        tb.innerHTML = '<tr><td colspan="6" class="muted">No invoices yet</td></tr>';
        document.getElementById('todaySales').textContent = 'Today: —';
        return;
      }
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Karachi' });
      let todayTotal = 0;
      list.forEach(inv => {
        const d = inv.created_at ? new Date(inv.created_at).toLocaleDateString('en-CA', { timeZone: 'Asia/Karachi' }) : '';
        if (d === today) todayTotal += Number(inv.total || 0);
      });
      document.getElementById('todaySales').textContent = 'Today: ' + money(todayTotal);
      tb.innerHTML = list.map(inv => `
        <tr>
          <td>#${esc(inv.local_number || inv.id)}</td>
          <td>${esc(inv.customer_name || '—')}</td>
          <td>${money(inv.total)}</td>
          <td>${money(inv.paid)}</td>
          <td class="muted">${inv.created_at ? new Date(inv.created_at).toLocaleString() : ''}</td>
          <td><button class="btn btn-sm" onclick="printInvoice(${Number(inv.id)})">Print</button></td>
        </tr>`).join('');
    } catch (e) {
      console.warn(e);
    }
  }

  async function printInvoice(id) {
    try {
      const data = await api('/wholesale/invoices/' + id);
      const inv = data.invoice;
      const items = data.items || [];
      const shop = document.getElementById('brandName')?.textContent || 'Wholesale';
      const w = window.open('', '_blank', 'width=420,height=640');
      if (!w) { alert('Allow popups to print'); return; }
      w.document.write(`<!DOCTYPE html><html><head><title>Invoice #${esc(inv.local_number)}</title>
        <style>
          body{font-family:monospace;padding:16px;font-size:13px;color:#111}
          table{width:100%;border-collapse:collapse;margin-top:8px}
          td,th{padding:4px;text-align:left;border-bottom:1px dotted #ccc}
          hr{border:none;border-top:1px dashed #333;margin:10px 0}
          h2{margin:0 0 6px;font-size:16px}
        </style></head><body>
        <h2>${esc(shop)}</h2>
        <div>Invoice #${esc(inv.local_number)} · ${inv.created_at ? new Date(inv.created_at).toLocaleString() : ''}</div>
        <div>Customer: ${esc(inv.customer_name || 'Walk-in')}</div>
        <hr>
        <table>
          <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amt</th></tr></thead>
          <tbody>
            ${items.map(it => `<tr>
              <td>${esc(it.name)}</td>
              <td>${esc(it.qty)}</td>
              <td>${money(it.unit_price)}</td>
              <td>${money(it.line_total)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        <hr>
        <div>Subtotal: ${money(inv.subtotal)}</div>
        <div>Discount: ${money(inv.discount)}</div>
        <div><b>Total: ${money(inv.total)}</b></div>
        <div>Paid (${esc(inv.payment_type || 'cash')}): ${money(inv.paid)}</div>
        <script>window.onload=function(){window.print();}</` + `script>
        </body></html>`);
      w.document.close();
    } catch (e) {
      alert(e.message || 'Print failed — ensure backend GET /invoices/:id is deployed');
    }
  }

  async function loadReport() {
    try {
      const data = await api('/wholesale/reports/today');
      const s = data.data || {};
      document.getElementById('stCount').textContent = s.invoice_count ?? 0;
      document.getElementById('stSales').textContent = money(s.total_sales);
      document.getElementById('stPaid').textContent = money(s.total_paid);
      document.getElementById('stDisc').textContent = money(s.total_discount);
      document.getElementById('todaySales').textContent = 'Today: ' + money(s.total_sales);
      const low = s.low_stock || [];
      document.getElementById('lowStockBox').innerHTML = low.length
        ? '<table><thead><tr><th>Product</th><th>Stock</th><th>Min</th></tr></thead><tbody>' +
          low.map(p => `<tr><td>${esc(p.name)}</td><td>${Number(p.stock)} ${esc(p.unit || '')}</td><td>${Number(p.min_stock)}</td></tr>`).join('') +
          '</tbody></table>'
        : 'No low-stock items';
    } catch (e) {
      // fallback from invoices list if report API not deployed yet
      document.getElementById('stCount').textContent = '—';
      document.getElementById('stSales').textContent = document.getElementById('todaySales').textContent.replace('Today: ', '') || '—';
      document.getElementById('lowStockBox').innerHTML =
        '<span class="muted">' + esc(e.message || 'Report API not available yet') + '</span>';
    }
  }

  if (token) boot().catch(() => logout());
  document.getElementById('password')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
